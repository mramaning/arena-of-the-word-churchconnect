<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Timers - Word Arena</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Glassmorphism Header for Sub-pages */
.header-container {
    position: relative;
    width: 100%;
    height: 120px; /* Smaller height for sub-pages */
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 3px solid #D4AF37;
    margin-bottom: 20px; /* Space before the forms */
}

.header-bg {
    position: absolute;
    top: -20px; left: -20px;
    width: calc(100% + 40px); height: calc(100% + 40px);
    background-image: url('logo.jpg');
    background-size: cover;
    background-position: center;
    filter: blur(8px) brightness(0.4);
    z-index: 1;
}

.header-glass {
    position: relative;
    z-index: 2;
    background: rgba(26, 26, 26, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    width: 90%;
    max-width: 500px;
    border-radius: 12px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    padding: 15px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

.header-glass h2 {
    margin: 0;
    font-size: 18px;
    color: #D4AF37;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
}

.back-btn {
    color: #E6E6FA;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    transition: color 0.3s;
}

.back-btn:hover {
    color: #D4AF37;
}
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; margin: 0; padding: 20px; color: #E6E6FA; }
    .header { background: linear-gradient(180deg, #2a004d 0%, #1a1a1a 100%); color: #D4AF37; padding: 15px; text-align: center; border-radius: 8px; border-bottom: 3px solid #D4AF37; margin-bottom: 20px; }
    .container { max-width: 600px; margin: auto; background: #2a2a2a; padding: 20px; border-radius: 10px; border: 1px solid #4B0082; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px; }
    input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #4B0082; border-radius: 5px; box-sizing: border-box; background: #1a1a1a; color: white; }
   button { 
    background: linear-gradient(135deg, #4B0082 0%, #2a004d 100%); 
    color: #D4AF37; 
    border: 1px solid #D4AF37; 
    font-weight: bold; 
    cursor: pointer; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
}
button:hover { 
    background: linear-gradient(135deg, #2a004d 0%, #4B0082 100%); 
    transform: translateY(-1px);
    box-shadow: 0 6px 8px rgba(212, 175, 55, 0.3);
}
    .back-btn { display: inline-block; margin-bottom: 20px; color: #D4AF37; text-decoration: none; font-weight: bold; }
    .visitor-item { border-bottom: 1px solid #4B0082; padding: 15px 0; }
    .visitor-name { font-weight: bold; font-size: 18px; color: #D4AF37; }
    .status-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; background-color: #4B0082; color: white; margin-top: 5px;}
</style>
</head>
<body>
    <div class="header-container">
    <div class="header-bg"></div>
    <div class="header-glass">
        <a href="index.html" class="back-btn">← Dashboard</a>
        <h2>First Timers</h2>
    </div>
</div>
        <form id="visitorForm">
            <label>First Name</label><input type="text" id="firstName" required>
            <label>Last Name</label><input type="text" id="lastName" required>
            <label>Phone Number (WhatsApp)</label><input type="tel" id="phone" required>
            <label>Invited By</label><input type="text" id="invitedBy">
            <label>Follow-up Status</label>
            <select id="status">
                <option value="Pending">Pending</option>
                <option value="Contacted">Contacted</option>
                <option value="Visited">Visited</option>
                <option value="Completed">Completed</option>
            </select>
            <button type="submit" id="submitBtn">Save Visitor</button>
        </form>
        <p id="message" style="color: green; font-weight: bold; text-align: center;"></p>
    </div>

    <div class="container">
        <h3>Recent First Timers</h3>
        <div id="visitorList"><p>Loading visitors...</p></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jicllwruxiyzdpkejtaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_fXcxoM2F0834DkoaiVEgNw_dmveYxmv';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return false; }
            return true;
        }

        async function loadVisitors() {
            if (!await checkAuth()) return;
            const listContainer = document.getElementById('visitorList');
            const { data, error } = await supabaseClient.from('first_timers').select('*').order('created_at', { ascending: false });

            if (error || data.length === 0) { listContainer.innerHTML = '<p>No first timers yet.</p>'; return; }
            
            listContainer.innerHTML = ''; 
            data.forEach(visitor => {
                listContainer.innerHTML += `
                    <div class="visitor-item">
                        <div class="visitor-name">${visitor.first_name} ${visitor.last_name}</div>
                        <div>📞 ${visitor.phone}</div>
                        <div>Invited by: ${visitor.invited_by || 'Unknown'}</div>
                        <span class="status-badge">${visitor.status}</span>
                    </div>`;
            });
        }

        document.getElementById('visitorForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            if (!await checkAuth()) return;
            const btn = document.getElementById('submitBtn'); const msg = document.getElementById('message');
            btn.textContent = 'Saving...'; btn.disabled = true;

            const { error } = await supabaseClient.from('first_timers').insert([{ 
                first_name: document.getElementById('firstName').value, 
                last_name: document.getElementById('lastName').value, 
                phone: document.getElementById('phone').value, 
                invited_by: document.getElementById('invitedBy').value, 
                status: document.getElementById('status').value 
            }]);

            if (error) { msg.textContent = 'Error saving.'; msg.style.color = 'red'; } 
            else { msg.textContent = 'Saved successfully!'; msg.style.color = 'green'; document.getElementById('visitorForm').reset(); loadVisitors(); }
            
            btn.textContent = 'Save Visitor'; btn.disabled = false;
        });
        loadVisitors();
    </script>
</body>
</html>
