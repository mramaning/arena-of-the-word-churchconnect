<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Word Arena</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: #2a2a2a; padding: 30px; border-radius: 10px; width: 100%; max-width: 350px; border-top: 5px solid #D4AF37; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    h2 { text-align: center; color: #D4AF37; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #4B0082; border-radius: 5px; box-sizing: border-box; background: #1a1a1a; color: white; }
    button { width: 100%; padding: 12px; background-color: #4B0082; color: #D4AF37; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #3a0066; }
    #message { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; }
</style>
</head>
<body>

    <div class="login-box">
        <h2>Word Arena Login</h2>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="login()" id="loginBtn">Login</button>
        <p id="message"></p>
    </div>

    <script>
        const SUPABASE_URL = 'https://jicllwruxiyzdpkejtaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_fXcxoM2F0834DkoaiVEgNw_dmveYxmv';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');
            const btn = document.getElementById('loginBtn');

            btn.textContent = 'Logging in...';
            btn.disabled = true;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                message.textContent = 'Error: ' + error.message;
                message.style.color = 'red';
                btn.textContent = 'Login';
                btn.disabled = false;
            } else {
                message.textContent = 'Login successful! Redirecting...';
                message.style.color = 'green';
                // Redirect to dashboard
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
