<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - Word Arena</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; margin: 0; padding: 20px; color: #E6E6FA; }
    .header { background: linear-gradient(180deg, #2a004d 0%, #1a1a1a 100%); color: #D4AF37; padding: 15px; text-align: center; border-radius: 8px; border-bottom: 3px solid #D4AF37; margin-bottom: 20px; }
    .container { max-width: 600px; margin: auto; background: #2a2a2a; padding: 20px; border-radius: 10px; border: 1px solid #4B0082; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    input, select, button { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #4B0082; border-radius: 5px; box-sizing: border-box; background: #1a1a1a; color: white; }
    button { background-color: #4B0082; color: #D4AF37; border: none; font-weight: bold; cursor: pointer; font-size: 16px; padding: 15px; }
    .back-btn { display: inline-block; margin-bottom: 20px; color: #D4AF37; text-decoration: none; font-weight: bold; }
    .member-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #4B0082; padding: 10px 0; }
    .status-select { width: 120px; margin: 0; padding: 8px; }
    .flex-row { display: flex; gap: 10px; }
    .flex-row > div { flex: 1; }
</style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn">← Back to Dashboard</a>
        <div class="header">
            <h2>Record Service Attendance</h2>
        </div>

        <div class="flex-row">
            <div>
                <label>Service Date</label>
                <input type="date" id="serviceDate" required>
            </div>
            <div>
                <label>Service Name</label>
                <select id="serviceName">
                    <option value="Sunday Service">Sunday Service</option>
                    <option value="Midweek Service">Midweek Service</option>
                    <option value="Special Program">Special Program</option>
                </select>
            </div>
        </div>

        <div id="membersContainer">
            <p>Loading members...</p>
        </div>

        <button type="button" id="saveBtn" onclick="saveAttendance()">Save Attendance</button>
        <p id="message" style="color: green; font-weight: bold; text-align: center; margin-top: 10px;"></p>
    </div>

    <script>
        const SUPABASE_URL = 'https://jicllwruxiyzdpkejtaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_fXcxoM2F0834DkoaiVEgNw_dmveYxmv';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let churchMembers = []; 
        document.getElementById('serviceDate').valueAsDate = new Date();

        // --- SECURITY CHECK ---
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html'; // Kick them out
                return false;
            }
            return true;
        }

        // --- LOAD MEMBERS ---
        async function loadMembers() {
            if (!await checkAuth()) return; // Check security first

            const container = document.getElementById('membersContainer');
            
            const { data, error } = await supabaseClient
                .from('members')
                .select('*')
                .eq('status', 'Active')
                .order('first_name', { ascending: true });

            if (error || data.length === 0) {
                container.innerHTML = '<p style="color: red;">No active members found. Please add members first.</p>';
                return;
            }

            churchMembers = data; 
            container.innerHTML = ''; 

            data.forEach(member => {
                const div = document.createElement('div');
                div.className = 'member-row';
                div.innerHTML = `
                    <div>
                        <div style="font-weight: bold; color: #333;">${member.first_name} ${member.last_name}</div>
                        <div style="font-size: 12px; color: #777;">Leader: ${member.assigned_leader}</div>
                    </div>
                    <select class="status-select" id="status-${member.id}">
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                        <option value="Excused">Excused</option>
                    </select>
                `;
                container.appendChild(div);
            });
        }

        // --- SAVE ATTENDANCE ---
        async function saveAttendance() {
            if (!await checkAuth()) return; // Check security first

            const date = document.getElementById('serviceDate').value;
            const service = document.getElementById('serviceName').value;
            const message = document.getElementById('message');
            const saveBtn = document.getElementById('saveBtn');

            if (!date) {
                alert("Please select a date!");
                return;
            }

            saveBtn.textContent = 'Saving...';
            saveBtn.disabled = true;

            const recordsToSave = churchMembers.map(member => {
                const status = document.getElementById(`status-${member.id}`).value;
                return {
                    service_date: date,
                    service_name: service,
                    member_id: member.id,
                    member_name: `${member.first_name} ${member.last_name}`,
                    status: status,
                    leader_name: member.assigned_leader
                };
            });

            const { data, error } = await supabaseClient
                .from('attendance')
                .insert(recordsToSave);

            if (error) {
                console.error(error);
                message.textContent = 'Error saving attendance.';
                message.style.color = 'red';
            } else {
                message.textContent = `Attendance saved successfully!`;
                message.style.color = 'green';
            }

            saveBtn.textContent = 'Save Attendance';
            saveBtn.disabled = false;
        }

        loadMembers();
    </script>
</body>
</html>
