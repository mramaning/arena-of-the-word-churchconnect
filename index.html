<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena of The Word Chapel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
       /* Glassmorphism Header */
.header-container {
    position: relative;
    width: 100%;
    height: 200px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 3px solid #D4AF37;
}

/* The blurred background logo */
.header-bg {
    position: absolute;
    top: -20px;
    left: -20px;
    width: calc(100% + 40px);
    height: calc(100% + 40px);
    background-image: url('logo.jpg');
    background-size: cover;
    background-position: center;
    filter: blur(8px) brightness(0.4); /* Blurs it and makes it dark */
    z-index: 1;
}

/* The dark glass overlay */
.header-glass {
    position: relative;
    z-index: 2;
    background: rgba(26, 26, 26, 0.6); /* Dark transparent glass */
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    width: 90%;
    max-width: 500px;
    border-radius: 15px;
    border: 1px solid rgba(212, 175, 55, 0.3); /* Faint gold border */
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.header-left img {
    width: 60px; 
    height: 60px;
    border-radius: 50%; 
    border: 2px solid #D4AF37; 
    object-fit: cover;
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
}

.header-text h1 {
    margin: 0;
    font-size: 18px;
    color: #D4AF37; 
    text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
}

.header-text p {
    margin: 3px 0 0 0;
    font-size: 11px;
    color: #E6E6FA;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.logout-btn {
    background-color: rgba(217, 83, 79, 0.2); 
    color: #ff6b6b; 
    border: 1px solid #ff6b6b; 
    padding: 8px 15px; 
    border-radius: 8px; 
    font-size: 12px; 
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
}

.logout-btn:hover {
    background-color: #d9534f;
    color: white;
}
/* Page Background */
body {
    background-color: #1a1a1a; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

/* Dashboard Cards */
.container {
    padding: 20px;
    max-width: 600px;
    margin: auto;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.card {
    background: #2a2a2a; 
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    text-decoration: none;
    color: #D4AF37; 
    font-weight: bold;
    border: 1px solid #4B0082; 
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 110px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}

.card:hover {
    background: #3a3a3a;
    border-color: #D4AF37; 
    transform: translateY(-2px);
}

.card-icon {
    font-size: 28px; /* Size of the icon */
    margin-bottom: 12px;
    color: #D4AF37; /* Gold color */
    text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); /* Subtle gold glow */
}

.welcome-text {
    color: #E6E6FA;
    text-align: center;
    font-size: 16px;
    margin-bottom: 15px;
    font-weight: normal;
}
    </style>
</head>
<body>

  <div class="header-container">
    <!-- The blurred background logo -->
    <div class="header-bg"></div>
    
    <!-- The glass panel on top -->
    <div class="header-glass">
        <div class="header-left">
            <img src="logo.jpg" alt="Word Arena Logo">
            <div class="header-text">
                <h1>Arena of The Word Chapel</h1>
                <p>ChurchConnect</p>
            </div>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

    <div class="container">
        <p class="welcome-text">Welcome, Pastor / Leader</p>
        <div class="dashboard-grid">
    
    <a href="members.html" class="card">
        <span class="card-icon"><i class="fa-solid fa-users"></i></span>
        Members
    </a>
    
    <a href="attendance.html" class="card">

        Attendance
    </a>
    
    <a href="first-timers.html" class="card">
        <span class="card-icon"><i class="fa-solid fa-user-plus"></i></span>
        First Timers
    </a>

    <a href="follow-up.html" class="card">
        <span class="card-icon"><i class="fa-solid fa-handshake-angle"></i></span>
        Follow-Up
    </a>
    
    <a href="announcements.html" class="card">
        <span class="card-icon"><i class="fa-solid fa-bullhorn"></i></span>
        Announcements
    </a>

</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jicllwruxiyzdpkejtaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_fXcxoM2F0834DkoaiVEgNw_dmveYxmv';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
            }
        }
        
        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        checkAuth();
    </script>
</body>
</html>
