<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Arena Connect</title>
    <style>
        body {
            background-color: #f4f4f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .header {
            background-color: #4B0082; /* Royal Purple */
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid #FFD700; /* Gold accent */
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: #E6E6FA;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #4B0082;
            font-weight: bold;
            border-top: 4px solid #4B0082;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100px;
        }
        .card:hover {
            background: #f9f9f9;
        }
        .card-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Arena of The Word Chapel</h1>
        <p>Word Arena Connect Dashboard</p>
    </div>

    <div class="container">
        <h3>Welcome, Pastor / Leader</h3>
        <div class="dashboard-grid">
            
            <a href="#" class="card">
                <span class="card-icon">👥</span>
                Members
            </a>
            
            <a href="#" class="card">
                <span class="card-icon">📋</span>
                Attendance
            </a>
            
            <a href="first-timers.html" class="card">
                <span class="card-icon">🙋🏽‍♂️</span>
                First Timers
            </a>
            
            <a href="#" class="card">
                <span class="card-icon">📢</span>
                Announcements
            </a>

        </div>
    </div>

</body>
</html>
