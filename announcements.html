<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - Word Arena</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; margin: 0; padding: 20px; color: #E6E6FA; }
    .header { background: linear-gradient(180deg, #2a004d 0%, #1a1a1a 100%); color: #D4AF37; padding: 15px; text-align: center; border-radius: 8px; border-bottom: 3px solid #D4AF37; margin-bottom: 20px; }
    .container { max-width: 600px; margin: auto; background: #2a2a2a; padding: 20px; border-radius: 10px; border: 1px solid #4B0082; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px; }
    input, textarea, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #4B0082; border-radius: 5px; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: white; }
    textarea { height: 100px; resize: vertical; }
    button { 
    background: linear-gradient(135deg, #4B0082 0%, #2a004d 100%); 
    color: #D4AF37; 
    border: 1px solid #D4AF37; 
    font-weight: bold; 
    cursor: pointer; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
}
button:hover { 
    background: linear-gradient(135deg, #2a004d 0%, #4B0082 100%); 
    transform: translateY(-1px);
    box-shadow: 0 6px 8px rgba(212, 175, 55, 0.3);
}
    .back-btn { display: inline-block; margin-bottom: 20px; color: #D4AF37; text-decoration: none; font-weight: bold; }
    .announcement-card { border-left: 5px solid #D4AF37; background: #1a1a1a; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
    .announcement-title { font-size: 18px; font-weight: bold; color: #D4AF37; margin-bottom: 5px; }
    .announcement-meta { font-size: 12px; color: #999; margin-bottom: 10px; }
    .announcement-body { font-size: 15px; color: #E6E6FA; line-height: 1.5; white-space: pre-wrap; }
</style>
</head>
<body>

    <!-- This is the Pastor's Form. It is hidden by default (style="display: none;") -->
    <div class="container" id="pastorFormContainer" style="display: none;">
        <a href="index.html" class="back-btn">← Back to Dashboard</a>
        <div class="header">
            <h2>Church Announcements</h2>
        </div>

        <form id="announcementForm">
            <label>Title</label>
            <input type="text" id="title" placeholder="e.g. Sunday Service Theme" required>

            <label>Message</label>
            <textarea id="message" placeholder="Type your message here..." required></textarea>

            <button type="submit" id="submitBtn">Publish Announcement</button>
        </form>
        <p id="statusMessage" style="color: green; font-weight: bold; text-align: center;"></p>
    </div>

    <div class="container">
        <!-- If a Leader is viewing, they need a way to go back -->
        <a href="index.html" class="back-btn" id="leaderBackBtn">← Back to Dashboard</a>
        <h3>Recent Announcements</h3>
        <div id="announcementsList">
            <p>Loading announcements...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jicllwruxiyzdpkejtaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_fXcxoM2F0834DkoaiVEgNw_dmveYxmv';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- 1. SECURITY CHECK & ROLE CHECK ---
        async function checkAuthAndRole() {
            // Check if they are logged in
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return false;
            }

            // Check their role in the profiles table
            const { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('role')
                .eq('id', session.user.id)
                .single();

            // If they are a Pastor, show the form
            if (profile && profile.role === 'Pastor') {
                document.getElementById('pastorFormContainer').style.display = 'block'; // Show form
                document.getElementById('leaderBackBtn').style.display = 'none'; // Hide duplicate back button
            }
            // If they are a Leader, the form stays hidden (display: none) and they only see the list

            return true;
        }

        // --- 2. LOAD ANNOUNCEMENTS ---
        async function loadAnnouncements() {
            if (!await checkAuthAndRole()) return;

            const listContainer = document.getElementById('announcementsList');
            
            const { data, error } = await supabaseClient
                .from('announcements')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                listContainer.innerHTML = '<p style="color: red;">Error loading announcements.</p>';
                return;
            }

            if (data.length === 0) {
                listContainer.innerHTML = '<p>No announcements yet.</p>';
                return;
            }

            listContainer.innerHTML = ''; 
            data.forEach(item => {
                const date = new Date(item.created_at).toLocaleDateString('en-GB', { 
                    weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' 
                });

                const div = document.createElement('div');
                div.className = 'announcement-card';
                div.innerHTML = `
                    <div class="announcement-title">${item.title}</div>
                    <div class="announcement-meta">Posted by ${item.author} on ${date}</div>
                    <div class="announcement-body">${item.message}</div>
                `;
                listContainer.appendChild(div);
            });
        }

        // --- 3. PUBLISH ANNOUNCEMENT (Only works if form is visible) ---
        document.getElementById('announcementForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 

            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');
            
            submitBtn.textContent = 'Publishing...';
            submitBtn.disabled = true;

            const title = document.getElementById('title').value;
            const message = document.getElementById('message').value;

            const { error } = await supabaseClient
                .from('announcements')
                .insert([{ 
                    title: title, 
                    message: message, 
                    author: 'Pastor' 
                }]);

            if (error) {
                console.error(error);
                statusMessage.textContent = 'Error publishing announcement.';
                statusMessage.style.color = 'red';
            } else {
                statusMessage.textContent = 'Announcement published successfully!';
                statusMessage.style.color = 'green';
                document.getElementById('announcementForm').reset(); 
                loadAnnouncements(); 
            }

            submitBtn.textContent = 'Publish Announcement';
            submitBtn.disabled = false;
        });

        // Run checks and load when page opens
        loadAnnouncements();
    </script>
</body>
</html>
