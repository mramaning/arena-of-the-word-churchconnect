<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - Word Arena</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; margin: 0; padding: 20px; color: #E6E6FA; }
        
        /* Glass Header */
        .header-container { position: relative; width: 100%; height: 120px; overflow: hidden; display: flex; align-items: center; justify-content: center; border-bottom: 3px solid #D4AF37; margin-bottom: 20px; }
        .header-bg { position: absolute; top: -20px; left: -20px; width: calc(100% + 40px); height: calc(100% + 40px); background-image: url('logo.jpg'); background-size: cover; background-position: center; filter: blur(8px) brightness(0.4); z-index: 1; }
        .header-glass { position: relative; z-index: 2; background: rgba(26, 26, 26, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); width: 90%; max-width: 500px; border-radius: 12px; border: 1px solid rgba(212, 175, 55, 0.3); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .header-glass h2 { margin: 0; font-size: 18px; color: #D4AF37; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .back-btn { color: #E6E6FA; text-decoration: none; font-weight: bold; font-size: 14px; transition: color 0.3s; }
        .back-btn:hover { color: #D4AF37; }

        /* Form & Container */
        .container { max-width: 600px; margin: auto; background: #2a2a2a; padding: 20px; border-radius: 10px; border: 1px solid #4B0082; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #4B0082; border-radius: 5px; box-sizing: border-box; background: #1a1a1a; color: white; }
        button { background: linear-gradient(135deg, #4B0082 0%, #2a004d 100%); color: #D4AF37; border: 1px solid #D4AF37; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: all 0.3s ease; }
        button:hover { background: linear-gradient(135deg, #2a004d 0%, #4B0082 100%); transform: translateY(-1px); box-shadow: 0 6px 8px rgba(212, 175, 55, 0.3); }
        
        /* Member List */
        .member-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #4B0082; padding: 15px 0; }
        .member-info { flex: 1; }
        .member-name { font-weight: bold; font-size: 18px; color: #D4AF37; margin-bottom: 5px; }
        .member-details { font-size: 14px; color: #ccc; margin-bottom: 5px; }
        
        /* Edit Button */
        .edit-btn { background: transparent; border: 1px solid #D4AF37; color: #D4AF37; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; margin: 0; padding: 0; }
        .edit-btn:hover { background: #D4AF37; color: #1a1a1a; }

        /* Modal (Popup Form) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #2a2a2a; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; border: 1px solid #D4AF37; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-header h3 { margin: 0; color: #D4AF37; }
        .close-btn { background: transparent; color: #d9534f; border: none; font-size: 20px; cursor: pointer; width: auto; padding: 0; margin: 0; box-shadow: none;}
        .close-btn:hover { background: transparent; transform: none; color: white; }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-bg"></div>
        <div class="header-glass">
            <a href="index.html" class="back-btn">← Dashboard</a>
            <h2>Church Members</h2>
        </div>
    </div>

    <div class="container">
        <h3>Register a Member</h3>
        <form id="memberForm">
            <label>First Name</label><input type="text" id="firstName" required>
            <label>Last Name</label><input type="text" id="lastName" required>
            <label>Phone Number</label><input type="tel" id="phone" required>
            <label>Email (Optional)</label><input type="email" id="email">
            <label>Date of Birth (Optional)</label><input type="date" id="dob">
            <label>Assign to Leader</label><input type="text" id="leader" placeholder="e.g. Leader Samuel" required>
            <button type="submit" id="submitBtn">Save Member</button>
        </form>
        <p id="message" style="color: green; font-weight: bold; text-align: center;"></p>
    </div>

    <div class="container">
        <h3>All Members</h3>
        <div id="memberList"><p>Loading members...</p></div>
    </div>

    <!-- EDIT MEMBER MODAL -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Member</h3>
                <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editId">
                <label>First Name</label><input type="text" id="editFirstName" required>
                <label>Last Name</label><input type="text" id="editLastName" required>
                <label>Phone Number</label><input type="tel" id="editPhone" required>
                <label>Email</label><input type="email" id="editEmail">
                <label>Date of Birth</label><input type="date" id="editDob">
                <label>Assigned Leader</label><input type="text" id="editLeader" required>
                <label>Status</label>
                <select id="editStatus">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
                <button type="submit" id="updateBtn">Update Member</button>
            </form>
            <p id="editMessage" style="text-align: center; font-weight: bold;"></p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jicllwruxiyzdpkejtaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_fXcxoM2F0834DkoaiVEgNw_dmveYxmv';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allMembers = []; // Store members here so we can find them when editing

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return false; }
            return true;
        }

        async function loadMembers() {
            if (!await checkAuth()) return;
            const listContainer = document.getElementById('memberList');
            
            const { data, error } = await supabaseClient.from('members').select('*').order('first_name', { ascending: true });

            if (error) { listContainer.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`; return; }
            if (data.length === 0) { listContainer.innerHTML = '<p>No members yet.</p>'; return; }

            allMembers = data; // Save to global variable
            listContainer.innerHTML = ''; 

            data.forEach(member => {
                const div = document.createElement('div');
                div.className = 'member-item';
                
                let dobText = '';
                if (member.date_of_birth) {
                    const dob = new Date(member.date_of_birth).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                    dobText = ` | 🎂 ${dob}`;
                }

                let statusColor = member.status === 'Active' ? '#006400' : '#d9534f';

                div.innerHTML = `
                    <div class="member-info">
                        <div class="member-name">${member.first_name} ${member.last_name} <span style="font-size:10px; color:${statusColor}; border:1px solid ${statusColor}; padding:2px 5px; border-radius:5px;">${member.status}</span></div>
                        <div class="member-details">📞 ${member.phone} ${dobText}</div>
                        <div class="member-details" style="color:#D4AF37;">Leader: ${member.assigned_leader}</div>
                    </div>
                    <button class="edit-btn" onclick="openEditModal(${member.id})"><i class="fa-solid fa-pen"></i></button>
                `;
                listContainer.appendChild(div);
            });
        }

        // --- OPEN MODAL & FILL DATA ---
        window.openEditModal = function(id) {
            const member = allMembers.find(m => m.id === id);
            if (!member) return;

            document.getElementById('editId').value = member.id;
            document.getElementById('editFirstName').value = member.first_name;
            document.getElementById('editLastName').value = member.last_name;
            document.getElementById('editPhone').value = member.phone;
            document.getElementById('editEmail').value = member.email || '';
            document.getElementById('editDob').value = member.date_of_birth || '';
            document.getElementById('editLeader').value = member.assigned_leader;
            document.getElementById('editStatus').value = member.status || 'Active';

            document.getElementById('editModal').style.display = 'flex';
        }

        window.closeModal = function() {
            document.getElementById('editModal').style.display = 'none';
            document.getElementById('editMessage').textContent = '';
        }

        // --- SAVE NEW MEMBER ---
        document.getElementById('memberForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            if (!await checkAuth()) return;
            const btn = document.getElementById('submitBtn'); const msg = document.getElementById('message');
            btn.textContent = 'Saving...'; btn.disabled = true;

            let dob = document.getElementById('dob').value;
            if (dob === '') dob = null;

            const { error } = await supabaseClient.from('members').insert([{ 
                first_name: document.getElementById('firstName').value, 
                last_name: document.getElementById('lastName').value, 
                phone: document.getElementById('phone').value, 
                email: document.getElementById('email').value, 
                date_of_birth: dob ? dob : null,
                assigned_leader: document.getElementById('leader').value,
                status: 'Active'
            }]);

            if (error) { msg.textContent = 'Error saving member.'; msg.style.color = 'red'; } 
            else { msg.textContent = 'Member saved successfully!'; msg.style.color = 'green'; document.getElementById('memberForm').reset(); loadMembers(); }
            
            btn.textContent = 'Save Member'; btn.disabled = false;
        });

        // --- UPDATE EXISTING MEMBER ---
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('updateBtn'); const msg = document.getElementById('editMessage');
            btn.textContent = 'Updating...'; btn.disabled = true;

            let dob = document.getElementById('editDob').value;
            if (dob === '') dob = null;

            const id = document.getElementById('editId').value;

            const { error } = await supabaseClient.from('members').update({
                first_name: document.getElementById('editFirstName').value,
                last_name: document.getElementById('editLastName').value,
                phone: document.getElementById('editPhone').value,
                email: document.getElementById('editEmail').value,
                date_of_birth: dob ? dob : null,
                assigned_leader: document.getElementById('editLeader').value,
                status: document.getElementById('editStatus').value
            }).eq('id', id);

            if (error) { 
                msg.textContent = 'Error updating member.'; msg.style.color = 'red'; 
            } else { 
                msg.textContent = 'Updated successfully!'; msg.style.color = 'green'; 
                loadMembers(); 
                setTimeout(closeModal, 1000); // Close modal after 1 second
            }
            btn.textContent = 'Update Member'; btn.disabled = false;
        });

        loadMembers();
    </script>
</body>
</html>
