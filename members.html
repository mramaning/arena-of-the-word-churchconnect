<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - Word Arena</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Glassmorphism Header for Sub-pages */
.header-container {
    position: relative;
    width: 100%;
    height: 120px; /* Smaller height for sub-pages */
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 3px solid #D4AF37;
    margin-bottom: 20px; /* Space before the forms */
}

.header-bg {
    position: absolute;
    top: -20px; left: -20px;
    width: calc(100% + 40px); height: calc(100% + 40px);
    background-image: url('logo.jpg');
    background-size: cover;
    background-position: center;
    filter: blur(8px) brightness(0.4);
    z-index: 1;
}

.header-glass {
    position: relative;
    z-index: 2;
    background: rgba(26, 26, 26, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    width: 90%;
    max-width: 500px;
    border-radius: 12px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    padding: 15px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

.header-glass h2 {
    margin: 0;
    font-size: 18px;
    color: #D4AF37;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
}

.back-btn {
    color: #E6E6FA;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    transition: color 0.3s;
}

.back-btn:hover {
    color: #D4AF37;
}
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; margin: 0; padding: 20px; color: #E6E6FA; }
    .header { background: linear-gradient(180deg, #2a004d 0%, #1a1a1a 100%); color: #D4AF37; padding: 15px; text-align: center; border-radius: 8px; border-bottom: 3px solid #D4AF37; margin-bottom: 20px; }
    .container { max-width: 600px; margin: auto; background: #2a2a2a; padding: 20px; border-radius: 10px; border: 1px solid #4B0082; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px; }
    input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #4B0082; border-radius: 5px; box-sizing: border-box; background: #1a1a1a; color: white; }
   button { 
    background: linear-gradient(135deg, #4B0082 0%, #2a004d 100%); 
    color: #D4AF37; 
    border: 1px solid #D4AF37; 
    font-weight: bold; 
    cursor: pointer; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
}
button:hover { 
    background: linear-gradient(135deg, #2a004d 0%, #4B0082 100%); 
    transform: translateY(-1px);
    box-shadow: 0 6px 8px rgba(212, 175, 55, 0.3);
}
    .back-btn { display: inline-block; margin-bottom: 20px; color: #D4AF37; text-decoration: none; font-weight: bold; }
    .member-item { border-bottom: 1px solid #4B0082; padding: 15px 0; }
    .member-name { font-weight: bold; font-size: 18px; color: #D4AF37; margin-bottom: 5px; }
    .member-details { font-size: 14px; color: #ccc; margin-bottom: 5px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge-leader { background-color: #4B0082; color: #D4AF37; }
    .badge-active { background-color: #006400; color: white; }
</style>
</head>
<body>

       <div class="header-container">
    <div class="header-bg"></div>
    <div class="header-glass">
        <a href="index.html" class="back-btn">← Dashboard</a>
        <h2>Register a Member</h2>
    </div>
</div>

        <form id="memberForm">
            <label>First Name</label>
            <input type="text" id="firstName" required>
            
            <label>Last Name</label>
            <input type="text" id="lastName" required>

            <label>Phone Number</label>
            <input type="tel" id="phone" required>

            <label>Email (Optional)</label>
            <input type="email" id="email">

<label>Date of Birth (Optional)</label>
<input type="date" id="dob">

            <label>Assign to Leader</label>
            <input type="text" id="leader" placeholder="e.g. Leader Samuel" required>

            <button type="submit" id="submitBtn">Save Member</button>
        </form>
        <p id="message" style="color: green; font-weight: bold; text-align: center;"></p>
    </div>

    <div class="container">
        <h3>Church Members</h3>
        <div id="memberList">
            <p>Loading members...</p>
        </div>
    </div>

        <script>
        // Your keys
        const SUPABASE_URL = 'https://jicllwruxiyzdpkejtaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_fXcxoM2F0834DkoaiVEgNw_dmveYxmv';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- SECURITY CHECK ---
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html'; // Kick them out if not logged in
                return false;
            }
            return true;
        }

        // --- LOAD MEMBERS ---
        async function loadMembers() {
    if (!await checkAuth()) return;

    const listContainer = document.getElementById('memberList');
    
    // Get members from database
    const { data, error } = await supabaseClient
        .from('members')
        .select('*')
        .order('assigned_leader', { ascending: true })
        .order('first_name', { ascending: true });

    // If there is an error, show it on the screen!
    if (error) {
        listContainer.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
        console.error(error);
        return;
    }

    if (data.length === 0) {
        listContainer.innerHTML = '<p>No members yet.</p>';
        return;
    }

    listContainer.innerHTML = ''; 
    
    const grouped = {};
    data.forEach(m => {
        const leaderName = m.assigned_leader || 'Unassigned';
        if (!grouped[leaderName]) grouped[leaderName] = [];
        grouped[leaderName].push(m);
    });

    for (const leader in grouped) {
        const leaderHeader = document.createElement('h4');
        leaderHeader.style.color = '#D4AF37';
        leaderHeader.style.borderBottom = '1px solid #4B0082';
        leaderHeader.style.paddingBottom = '5px';
        leaderHeader.style.marginTop = '20px';
        leaderHeader.textContent = `Leader: ${leader}`;
        listContainer.appendChild(leaderHeader);

        grouped[leader].forEach(member => {
            const div = document.createElement('div');
            div.className = 'member-item';
            div.style.borderBottom = 'none';
            
            // Format the birthday if it exists
            let dobText = '';
            if (member.date_of_birth) {
                const dob = new Date(member.date_of_birth).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                dobText = ` | 🎂 ${dob}`;
            }

            div.innerHTML = `
                <div class="member-name">${member.first_name} ${member.last_name}</div>
                <div class="member-details">📞 ${member.phone} ${dobText}</div>
            `;
            listContainer.appendChild(div);
        });
    }
}

        // --- SAVE NEW MEMBER ---
        document.getElementById('memberForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            if (!await checkAuth()) return; // Check security before saving

            const submitBtn = document.getElementById('submitBtn');
            const message = document.getElementById('message');
            
            submitBtn.textContent = 'Saving...';
            submitBtn.disabled = true;

            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const dob = document.getElementById('dob').value;
            const leader = document.getElementById('leader').value;

            const { data, error } = await supabaseClient
                .from('members')
                ..insert([{ 
    first_name: firstName, 
    last_name: lastName, 
    phone: phone, 
    email: email, 
    date_of_birth: dob || null, // <--- ADD THIS LINE
    assigned_leader: leader,
    status: 'Active'
}]);

            if (error) {
                message.textContent = 'Error saving member.';
                message.style.color = 'red';
            } else {
                message.textContent = 'Member saved successfully!';
                message.style.color = 'green';
                document.getElementById('memberForm').reset(); 
                loadMembers(); 
            }

            submitBtn.textContent = 'Save Member';
            submitBtn.disabled = false;
        });

        // Start loading
        loadMembers();
    </script>
</body>
</html>
